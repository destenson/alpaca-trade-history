<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading Performance Report</title>
<script>
// In-page links ("#positions", "#fillodds") must never navigate: inside the web app the report is a srcdoc
// frame whose links resolve against the app's own address, so a click that lands before the report's
// script has set up its handlers (e.g. right after a redraw) would load the app page into the frame.
document.addEventListener('click', function (e) {
  var a = e.target.closest && e.target.closest('a[href^="#"]');
  if (a) e.preventDefault();
}, true);
</script>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10);
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
  --series-5: #e87ba4; --series-6: #008300; --series-7: #6250d6; --series-8: #e34948;
  --gain: #2a78d6; --loss: #e34948; --loss-fill: rgba(227,73,72,0.14);
  --gain-text: #1c5cab; --loss-text: #b8302f; --accent: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --series-5: #d55181; --series-6: #0ca30c; --series-7: #9085e9; --series-8: #e66767;
    --gain: #3987e5; --loss: #e66767; --loss-fill: rgba(230,103,103,0.18);
    --gain-text: #6da7ec; --loss-text: #ee8a8a; --accent: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
  --series-5: #d55181; --series-6: #0ca30c; --series-7: #9085e9; --series-8: #e66767;
  --gain: #3987e5; --loss: #e66767; --loss-fill: rgba(230,103,103,0.18);
  --gain-text: #6da7ec; --loss-text: #ee8a8a; --accent: #3987e5;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 20px 24px 0; max-width: 1360px; margin: 0 auto; display: flex; flex-wrap: wrap;
  gap: 8px 16px; align-items: baseline; justify-content: space-between; }
header h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
header .meta { color: var(--ink-2); font-size: 13px; }
nav { position: sticky; top: 0; z-index: 5; background: var(--page); border-bottom: 1px solid var(--grid); }
nav .in { max-width: 1360px; margin: 0 auto; padding: 0 16px; display: flex; gap: 2px; overflow-x: auto;
  scrollbar-width: none; }
nav a { padding: 12px 12px 10px; color: var(--ink-2); text-decoration: none; white-space: nowrap;
  border-bottom: 2px solid transparent; font-weight: 500; }
nav a:hover { color: var(--ink); }
nav a.on { color: var(--ink); border-bottom-color: var(--accent); }
nav button { margin-left: auto; background: none; border: 1px solid var(--ring); color: var(--ink-2);
  border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; align-self: center; }
main { max-width: 1360px; margin: 0 auto; padding: 16px 24px 48px; }
section.tab { display: none; }
section.tab.on { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
section.tab > h2 { grid-column: 1 / -1; font-size: 16px; margin: 4px 0 0; font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 14px 16px 10px;
  margin: 0; min-width: 0; }
.card.wide, .tiles, .tablewrap.wide { grid-column: 1 / -1; }
.card h3 { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
.card .sub { margin: 0 0 8px; color: var(--ink-2); font-size: 12.5px; }
.card .note { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 12px 14px; }
.tile .tl { color: var(--ink-2); font-size: 12px; }
.tile .tv { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.tile .td { color: var(--muted); font-size: 12px; }
.tablewrap { overflow: auto; max-height: 560px; border-top: 1px solid var(--grid); }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
th { position: sticky; top: 0; background: var(--surface); text-align: left; font-weight: 600; color: var(--ink-2);
  padding: 7px 10px; border-bottom: 1px solid var(--axis); cursor: pointer; white-space: nowrap; user-select: none; }
th.asc::after { content: " ▲"; font-size: 9px; } th.desc::after { content: " ▼"; font-size: 9px; }
td { padding: 6px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
tr:hover td { background: color-mix(in srgb, var(--accent) 6%, transparent); }
td.pos { color: var(--gain-text); } td.neg { color: var(--loss-text); }
/* option legs: expiry once, buys blue, sells red */
.legs { white-space: nowrap; }
.legs .lx { color: var(--muted); }
.legs .lsep { color: var(--muted); }
.legs .lg.buy { color: var(--gain-text); font-weight: 500; }
.legs .lg.sell { color: var(--loss-text); font-weight: 500; }
/* collapsible table groups */
tr.grp-sum td { font-weight: 600; }
tr.grp-row td { background: var(--page); }
tr.grp-row td:first-child { padding-left: 2em; }
.grp-tog { border: 0; background: none; color: var(--muted); cursor: pointer; font: inherit; font-size: 11px;
  width: 1.4em; padding: 0; margin-right: 0.25em; }
.grp-tog:hover, .grp-tog:focus-visible { color: var(--ink); }
.grp-all { display: block; margin: 0 0 6px auto; border: 0; background: none; padding: 0; cursor: pointer;
  font: inherit; font-size: 12px; color: var(--series-1); }
.grp-all:hover { text-decoration: underline; }
/* "$" in tables: lighter and spaced so it is not misread as a 5 */
td .cur { color: var(--muted); margin-right: 0.18em; font-weight: 400; }
.prose ul { margin: 4px 0; padding-left: 20px; } .prose li { margin: 6px 0; color: var(--ink-2); }
.prose b { color: var(--ink); }
.empty { color: var(--muted); }
.pick { display: flex; gap: 8px; align-items: center; margin: 8px 0 10px; color: var(--ink-2); font-size: 12.5px; }
.pick select { font: inherit; font-size: 13px; color: var(--ink); background: var(--page); border: 1px solid var(--axis);
  border-radius: 8px; padding: 6px 8px; max-width: 100%; flex: 1 1 auto; }
.interp-view .tablewrap { max-height: none; margin-bottom: 8px; }
.rp-table td, .rp-table th { white-space: nowrap; }
[data-tip] { text-decoration: underline dotted color-mix(in srgb, currentColor 45%, transparent); text-underline-offset: 3px; }
[data-tip]:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; border-radius: 3px; }
#tip { position: fixed; z-index: 50; max-width: 300px; padding: 7px 10px; border-radius: 8px; font-size: 12.5px;
  line-height: 1.4; color: var(--ink); background: var(--surface); border: 1px solid var(--axis);
  box-shadow: 0 6px 20px rgba(0,0,0,0.18); pointer-events: none; font-weight: 400; text-transform: none; letter-spacing: 0; }
#tip[hidden] { display: none; }
/* tickers: link to Alpaca's trade page; the chart icon links to TradingView and previews a mini chart */
a.tk { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--muted); }
/* an order's limit price: in the web app it opens the change-price popup; plain text elsewhere */
button.ord-edit { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; text-align: inherit; }
/* clickable prices: a dashed underline and a pencil that are always visible, a tint on hover */
.embedded button.ord-edit { cursor: pointer; border-radius: 4px; padding: 0 3px; margin: 0 -3px;
  border-bottom: 1px dashed color-mix(in srgb, var(--series-1) 70%, transparent); }
.embedded button.ord-edit::after { content: "✎"; margin-left: 4px; font-size: 0.85em; color: var(--series-1); opacity: 0.75; }
.embedded button.ord-edit:hover, .embedded button.ord-edit:focus-visible {
  background: color-mix(in srgb, var(--series-1) 14%, transparent); border-bottom-style: solid; }
.embedded button.ord-edit:hover::after, .embedded button.ord-edit:focus-visible::after { opacity: 1; }
a.tk:hover, a.tk:focus-visible { color: var(--series-1); border-bottom-color: currentColor; }
a.tv { text-decoration: none; font-size: 0.85em; margin-left: 0.3em; opacity: 0.6; }
a.tv:hover, a.tv:focus-visible { opacity: 1; }
#tvpop { position: fixed; z-index: 60; width: 380px; height: 230px; max-width: calc(100vw - 16px); border-radius: 10px;
  overflow: hidden; background: var(--surface); border: 1px solid var(--grid); box-shadow: 0 8px 28px rgba(0,0,0,.25); }
#tvpop[hidden] { display: none; }
#tvpop iframe { width: 100%; height: 100%; border: 0; display: block; }
.tilelink { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
figure.card[id] { scroll-margin-top: 64px; }
.tilelink:hover { color: var(--ink); }
.scalebtn { float: right; margin: -2px 0 4px 8px; font: inherit; font-size: 11.5px; padding: 2px 9px; border-radius: 999px;
  color: var(--ink-2); background: transparent; border: 1px solid var(--axis); cursor: pointer; position: relative; z-index: 2; }
.scalebtn:hover { color: var(--ink); }
.scalebtn[aria-pressed="true"] { color: var(--accent-ink, #fff); background: var(--series-1); border-color: var(--series-1); }
.rp-table tr.stale td { background: color-mix(in srgb, var(--series-1) 10%, transparent); }
.rp-table tr.stale td.rp-move { font-weight: 600; }
.rp-table input { font: inherit; font-size: 13px; width: 6.5em; padding: 3px 6px; color: var(--ink); background: var(--page);
  border: 1px solid var(--axis); border-radius: 6px; }
.rp-table input.rp-iv { width: 4.5em; }
.rp-table input:invalid { border-color: var(--loss); }
.rp-table button { font: inherit; font-size: 12px; color: var(--ink-2); background: transparent; border: 1px solid var(--axis);
  border-radius: 6px; padding: 3px 8px; cursor: pointer; }
.rp-table tr.edited td:first-child::after { content: " · edited"; color: var(--muted); font-weight: 400; font-size: 11px; }
.alert { grid-column: 1 / -1; border: 1px solid var(--loss); border-left-width: 4px; border-radius: 10px;
  background: color-mix(in srgb, var(--loss) 8%, var(--surface)); padding: 10px 16px; }
.alert ul { margin: 4px 0 0; padding-left: 18px; color: var(--ink-2); }
.plot { width: 100%; }
footer { max-width: 1360px; margin: 0 auto; padding: 0 24px 32px; color: var(--muted); font-size: 12px; }
@media (max-width: 860px) {
  header, main { padding-left: 16px; padding-right: 16px; }
  section.tab.on { grid-template-columns: minmax(0, 1fr); }
  .tile .tv { font-size: 19px; }
}
</style>

<body>
<header>
  <h1>Trading performance</h1>
  <div class="meta">{{SPAN}} · generated {{GENERATED}}</div>
</header>
<nav><div class="in">{{NAV}}<button id="theme" type="button" aria-label="Toggle color theme">Theme</button></div></nav>
<main>{{BODY}}</main>
<footer>Built by alpaca-analyzer from Alpaca account activities, portfolio history and market data. Not investment advice.</footer>
{{PLOTLY}}
<script>
const FIGS = {{FIGS}};
const drawn = new Set();
function tok(name) { return getComputedStyle(document.documentElement).getPropertyValue('--' + name).trim(); }
function resolve(v) {
  if (typeof v === 'string' && v.startsWith('var:')) return tok(v.slice(4));
  if (Array.isArray(v)) return v.map(resolve);
  if (v && typeof v === 'object') { const o = {}; for (const k in v) o[k] = resolve(v[k]); return o; }
  return v;
}
function axis(extra) {
  return Object.assign({ gridcolor: tok('grid'), linecolor: tok('axis'), zerolinecolor: tok('axis'),
    tickfont: { color: tok('muted'), size: 11 }, title: { font: { color: tok('ink-2'), size: 12 } },
    automargin: true, showline: false }, extra || {});
}
function layoutFor(spec) {
  const l = resolve(spec.layout);
  const base = { paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
    font: { family: 'system-ui, -apple-system, Segoe UI, sans-serif', color: tok('ink'), size: 12 },
    legend: { orientation: 'h', y: 1.02, yanchor: 'bottom', x: 0, font: { color: tok('ink-2'), size: 12 } },
    hoverlabel: { bgcolor: tok('surface'), bordercolor: tok('axis'), font: { color: tok('ink'), size: 12 } } };
  const out = Object.assign({}, base, l);
  out.xaxis = axis(Object.assign({ hoverformat: '' }, l.xaxis || {}));
  out.yaxis = axis(l.yaxis);
  for (const k of Object.keys(l)) if (/^[xy]axis\d+$/.test(k)) out[k] = axis(l[k]);   // secondary axes
  delete out.xaxis.hoverformat;
  return out;
}
function draw(id) {
  const el = document.getElementById(id); let spec = FIGS[id];
  if (!el || !spec || typeof Plotly === 'undefined') return;
  if (spec.symlog) spec = symlogSpec(spec);
  Plotly.react(el, resolve(spec.data), layoutFor(spec), { displaylogo: false, responsive: true,
    modeBarButtonsToRemove: ['lasso2d', 'select2d', 'autoScale2d'] });
  drawn.add(id);
}
function drawVisible() {
  document.querySelectorAll('section.tab.on .plot').forEach(el => { if (el.offsetParent !== null) draw(el.id); });
}
function show(id) {
  const secs = document.querySelectorAll('section.tab');
  if (!document.getElementById(id)) id = secs[0] && secs[0].id;
  secs.forEach(s => s.classList.toggle('on', s.id === id));
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.dataset.tab === id));
  try { localStorage.setItem('aa-tab', id); } catch (e) {}
  // the host may refresh on a tab switch: not while re-pricing inputs hold the reader's own edits
  if (window.parent !== window) parent.postMessage({ type: 'aa-tab', tab: id, edited: !!document.querySelector('.rp-table tr.edited') }, '*');
  requestAnimationFrame(drawVisible);
}
document.querySelectorAll('nav a').forEach(a => a.addEventListener('click', e => {
  e.preventDefault(); try { history.replaceState(null, '', '#' + a.dataset.tab); } catch (err) {} show(a.dataset.tab);
}));
// Theme. When the report is embedded (e.g. the web app's sandboxed frame), the host page owns the
// theme: the toggle asks the host to switch, and the host pushes its theme in. Only a theme name is
// ever exchanged.
const EMBEDDED = window.parent !== window;
if (EMBEDDED) document.documentElement.classList.add('embedded');
// an order's limit price opens the host page's change-price popup; only the order id and the reference
// prices shown next to the input are passed (the host looks the order up itself)
document.addEventListener('click', (e) => {
  const b = e.target.closest('button.ord-edit');
  if (!b || !EMBEDDED) return;
  let ref = {};
  try { ref = JSON.parse(b.dataset.ref || '{}'); } catch (_) {}
  parent.postMessage({ type: 'aa-edit-order', id: b.dataset.oid, ref }, '*');
});
function setTheme(t, notify) {
  const root = document.documentElement;
  if (t === 'light' || t === 'dark') root.dataset.theme = t; else delete root.dataset.theme;
  try { localStorage.setItem('aa-theme', root.dataset.theme || ''); } catch (e) {}
  drawn.clear(); drawVisible();
  if (notify && EMBEDDED) parent.postMessage({ type: 'aa-theme', theme: root.dataset.theme }, '*');
}
document.getElementById('theme').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  setTheme(dark ? 'light' : 'dark', true);
});
window.addEventListener('message', (e) => {
  if (!EMBEDDED || e.source !== window.parent || !e.data) return;
  if (e.data.type === 'aa-set-theme') setTheme(e.data.theme, false);
  if (e.data.type === 'aa-set-tab' && typeof e.data.tab === 'string') show(e.data.tab);
  if (e.data.type === 'aa-set-log' && Array.isArray(e.data.ids)) {
    for (const id of e.data.ids) if (typeof id === 'string') setLog(id, true, false);
  }
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { drawn.clear(); drawVisible(); });
// alternative readings of open positions: one view visible at a time
document.querySelectorAll('select.interp').forEach(sel => sel.addEventListener('change', () => {
  const box = document.getElementById(sel.dataset.box);
  box.querySelectorAll(':scope > .interp-view').forEach(v => { v.hidden = v.id !== sel.value; });
  box.querySelectorAll('#' + sel.value + ' .plot').forEach(el => draw(el.id));
}));
// Re-pricing of open orders (Orders tab): Black-Scholes in the page so edited prices / IV changes
// update the estimates, table cells and charts for that underlying. Mirrors engine/src/reprice.rs.
(function () {
  const holder = document.getElementById('rp-data');
  if (!holder) return;
  const RP = JSON.parse(holder.textContent);
  const R = RP.r;
  function erf(x) {  // Abramowitz-Stegun 7.1.26, |error| < 1.5e-7
    const s = Math.sign(x); x = Math.abs(x);
    const t = 1 / (1 + 0.3275911 * x);
    return s * (1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x));
  }
  const N = (x) => 0.5 * (1 + erf(x / Math.SQRT2));
  function bs(S, K, T, iv, call) {
    if (T <= 0 || iv <= 0) return call ? Math.max(S - K, 0) : Math.max(K - S, 0);
    const v = iv * Math.sqrt(T), d1 = (Math.log(S / K) + (R + 0.5 * iv * iv) * T) / v, d2 = d1 - v, df = Math.exp(-R * T);
    return call ? S * N(d1) - K * df * N(d2) : K * df * N(-d2) - S * N(-d1);
  }
  // P&L of a leg set at underlying S (legs: [strike, is_call, qty x100, T, iv])
  function pnl(m, S, shift, dt = 0) {
    let y = -m.cost + m.shares * S;
    for (const [K, c, q, T, iv] of m.legs) y += q * bs(S, K, Math.max(T - dt, 0), Math.max(iv * (1 + shift), 1e-3), c === 1);
    return y;
  }
  const r2 = (v) => Math.round(v * 100) / 100;
  const fmt = (v) => '$' + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const px = (v) => fmt(v) + (v > 0 ? ' debit' : v < 0 ? ' credit' : ' even');
  const signed = (v) => (v < 0 ? '−' : v > 0 ? '+' : '') + fmt(v);
  const cellSigned = (v) => fmt(v);   // table cells: no sign, the cell's color shows it
  function fillText(est, net) {
    const e = est - net;
    return e <= 0.005 ? 'at or through your limit: likely to fill near the open'
      : `your limit is ${fmt(e)} better than the estimate: fills only if prices move your way`;
  }
  const table = document.getElementById('t_orders');
  const col = (name) => table ? [...table.tHead.rows[0].cells].findIndex((c) => c.textContent === name) : -1;
  const cEst = col(RP.est_col), cEdge = col('Edge vs est.'), cSpot = col('Spot');
  function setCell(k, ci, text, v, pn) {
    if (!table || ci < 0) return;
    const row = [...table.tBodies[0].rows].find((r) => r.cells[0].dataset.v === String(k));
    if (!row) return;
    const td = row.cells[ci];
    // a clickable price keeps its button; the popup then prefills the re-priced value
    const btn = td.querySelector('button.ord-edit');
    (btn || td).innerHTML = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/\$/g, () => '<span class="cur">$</span>');
    if (btn && Number.isFinite(v)) {
      try { const r = JSON.parse(btn.dataset.ref || '{}'); r.prefill = Math.round(v * 100) / 100; r.est = v; btn.dataset.ref = JSON.stringify(r); } catch (_) {}
    }
    td.dataset.v = String(v);
    if (pn) { td.classList.toggle('pos', v > 0); td.classList.toggle('neg', v < 0); }
  }
  function update(tr, rowOnly) {
    const und = tr.dataset.und;
    const sIn = tr.querySelector('.rp-spot'), vIn = tr.querySelector('.rp-iv');
    const S = parseFloat(sIn.value), shift = (parseFloat(vIn.value) || 0) / 100;
    if (!(S > 0) || !(shift > -0.95)) return;
    const ref = parseFloat(sIn.dataset.ref);
    const mv = tr.querySelector('.rp-move');
    const move = S / ref - 1;
    mv.textContent = (move < 0 ? '−' : move > 0 ? '+' : '') + Math.abs(move * 100).toFixed(1) + '%';
    tr.classList.toggle('stale', Math.abs(move) >= 0.02);
    tr.classList.toggle('edited', sIn.value !== sIn.dataset.default || (parseFloat(vIn.value) || 0) !== 0);
    if (rowOnly) return;
    for (const v of RP.views) {
      if (v.und !== und) continue;
      const spec = FIGS[v.fid];
      spec.data[v.t_open].y = v.x.map((x) => r2(pnl(v.order, x, shift)));
      for (const [ti, dt] of v.days || []) spec.data[ti].y = v.x.map((x) => r2(pnl(v.order, x, shift, dt)));
      if (v.t_comb !== null && v.pos) spec.data[v.t_comb].y = v.x.map((x) => r2(pnl(v.order, x, shift) + pnl(v.pos, x, shift)));
      const at = pnl(v.order, S, shift);
      if (v.t_mark !== null) { spec.data[v.t_mark].x = [S]; spec.data[v.t_mark].y = [r2(at)]; }
      spec.layout.shapes[0].x0 = spec.layout.shapes[0].x1 = S;
      spec.layout.annotations[0].x = S;

// Tooltips: any element with data-tip (table headers, tile labels). A floating box instead of the native

(function () {

  document.addEventListener('pointerover', (e) => { const el = e.target.closest('[data-tip]'); if (el && e.pointerType !== 'touch') place(el); });
  document.addEventListener('pointerout', (e) => { if (cur && !cur.contains(e.relatedTarget)) hide(); });
  document.addEventListener('focusin', (e) => { const el = e.target.closest('[data-tip]'); if (el) place(el); });
  document.addEventListener('focusout', hide);

    const el = e.target.closest('[data-tip]');

// Signed log scale ("Log" button on charts): v -> sign(v)·log10(1 + |v|/c), i.e. log for large values,
// −log(−v) for large negative ones, and linear within ±c of zero so the curve passes smoothly through 0.
// The chart is drawn from a transformed copy; ticks and hover show the real values.
function logEligible(spec) {
  const d = spec.data, L = spec.layout;
  if (!d.length || L.barmode === 'stack' || L.barmode === 'relative') return null;
  if (d.some((t) => !['scatter', 'bar'].includes(t.type || 'scatter'))) return null;
  const horiz = d.some((t) => t.orientation === 'h');
  const k = horiz ? 'x' : 'y';
  const vals = d.flatMap((t) => (t[k] || []).filter((v) => typeof v === 'number'));
  if (vals.length < 2 || !vals.some((v) => v !== 0)) return null;
  return k;
}
function niceUnit(vals) {
  const a = vals.map(Math.abs).filter((v) => v > 0).sort((x, y) => x - y);
  const q = a[Math.floor(a.length * 0.1)] || a[0];
  return Math.pow(10, Math.floor(Math.log10(q)));
}
function symlogSpec(spec) {
  const k = spec.symlogAxis;                       // 'x' (horizontal charts) or 'y'
  const L = JSON.parse(JSON.stringify(spec.layout));
  const data = spec.data.map((t) => ({ ...t }));
  const axisOf = (t) => (t[k + 'axis'] || k);      // 'y', 'y2', 'x2' ...
  const layoutKey = (ax) => ax.replace(/^([xy])(\d*)$/, (m, a, n) => a + 'axis' + n);
  const groups = {};
  for (const t of data) (groups[axisOf(t)] ||= []).push(t);
  const fwd = {};
  for (const [ax, traces] of Object.entries(groups)) {
    const lk = layoutKey(ax), A = (L[lk] ||= {});
    const vals = traces.flatMap((t) => (t[k] || []).filter((v) => typeof v === 'number'));
    if (!vals.length) continue;
    const c = niceUnit(vals);
    const f = (v) => (typeof v === 'number' ? Math.sign(v) * Math.log10(1 + Math.abs(v) / c) : v);
    fwd[ax] = f;
    const pct = /%/.test(A.tickformat || ''), money = (A.tickprefix || '') === '$';
    const fmt = (v, tick) => {
      if (typeof v !== 'number') return '';
      const s = v < 0 ? '−' : '';
      let x = Math.abs(pct ? v * 100 : v);
      const unit = x >= 1e6 ? [1e6, 'M'] : x >= 1e3 ? [1e3, 'k'] : [1, ''];
      const body = tick ? (x / unit[0]).toLocaleString('en-US', { maximumFractionDigits: x < 1 ? 3 : 1 }) + unit[1]
        : x.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      return s + (money ? '$' : '') + body + (pct ? '%' : '');
    };
    for (const t of traces) {
      const orig = t[k];
      t[k] = (orig || []).map(f);
      t.hovertext = (orig || []).map((v) => fmt(v, false));
      if (t.hovertemplate) {
        t.hovertemplate = t.hovertemplate.replace(new RegExp('%\\{' + k + '(:[^}]*)?\\}', 'g'), '%{hovertext}');
      } else if (t.hoverinfo !== 'skip') {
        t.hovertemplate = (t.name ? t.name + ': ' : '') + '%{hovertext}<extra></extra>';
      }
      if (t.base !== undefined && typeof t.base === 'number') t.base = f(t.base);
    }
    // ticks at 0 and ±c·10^n across the data's range
    const lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
    const ticks = [0];
    const span = Math.log10(Math.max(hi, -lo, c) / c);
    const steps = span < 2.5 ? [1, 2, 5] : [1];           // fewer decades -> 1-2-5 ticks
    for (let n = 0; n < 12; n++) {
      for (const m of steps) {
        const v = m * c * Math.pow(10, n);

        if (-v >= lo * 1.0001) ticks.push(-v);
      }
    }
    // keep labels apart: walk outward from 0 on each side, dropping ticks too close to the last one kept
    const gap = (f(hi) - f(lo)) / 9;
    const kept = [0];
    for (const side of [1, -1]) {
      let last = 0;
      for (const v of ticks.filter((t) => Math.sign(t) === side).sort((x, y) => Math.abs(x) - Math.abs(y))) {
        if (Math.abs(f(v) - last) >= gap) { kept.push(v); last = f(v); }
      }
    }
    A.tickmode = 'array'; A.tickvals = kept.map(f); A.ticktext = kept.map((v) => fmt(v, true));
    delete A.tickformat; delete A.tickprefix; delete A.ticksuffix;
    if (A.range) A.range = A.range.map(f);
  }
  // overlaid secondary axis with a fixed range: keep its zero level with the main axis
  for (const [ax, f] of Object.entries(fwd)) {
    const lk = layoutKey(ax), A = L[lk], main = L[k + 'axis'];
    if (ax === k || !A || !A.overlaying || !A.range || !main || !main.range) continue;
    const [a, b] = main.range;
    const vs = groups[ax].flatMap((t) => (t[k] || []).filter((v) => typeof v === 'number'));
    const kk = Math.max(...vs.map((v) => (v > 0 && b > 0 ? v / b : v < 0 && a < 0 ? v / a : 0)), 0) * 1.1 || 1;
    A.range = [a * kk, b * kk];
  }
  if (L.shapes) {
    L.shapes = L.shapes.map((sh) => {
      const ref = sh[k + 'ref'] || k;
      if (ref === 'paper' || !fwd[ref]) return sh;
      return { ...sh, [k + '0']: fwd[ref](sh[k + '0']), [k + '1']: fwd[ref](sh[k + '1']) };
    });
  }
  if (L.annotations) {
    L.annotations = L.annotations.map((an) => {
      const ref = an[k + 'ref'] || k;
      return ref === 'paper' || !fwd[ref] || typeof an[k] !== 'number' ? an : { ...an, [k]: fwd[ref](an[k]) };
    });

}
// The choice is remembered per chart: in this browser's storage when the report is opened on its own, or by
// the web app (which owns storage) when embedded in its sandboxed frame.
const LOG_KEY = 'aa-log';
const logBtns = {};
function setLog(id, on, save) {
  const spec = FIGS[id], btn = logBtns[id];
  if (!spec || !btn || Boolean(spec.symlog) === on) return;
  spec.symlog = on;
  btn.setAttribute('aria-pressed', String(on));
  const el = document.getElementById(id);
  if (el && el.offsetParent !== null) draw(id); else drawn.delete(id);
  if (!save) return;
  if (EMBEDDED) { parent.postMessage({ type: 'aa-log', id, on }, '*'); return; }
  try {
    const ids = new Set(JSON.parse(localStorage.getItem(LOG_KEY) || '[]'));
    if (on) ids.add(id); else ids.delete(id);
    localStorage.setItem(LOG_KEY, JSON.stringify([...ids]));
  } catch (e) { /* storage unavailable */ }
}
for (const [id, spec] of Object.entries(FIGS)) {
  const k = logEligible(spec);
  const el = document.getElementById(id);
  if (!k || !el) continue;
  spec.symlogAxis = k;
  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'scalebtn'; btn.textContent = 'Log';
  btn.setAttribute('aria-pressed', 'false');
  btn.title = 'Switch between a linear and a logarithmic scale (negative values: −log, linear near zero)';
  btn.addEventListener('click', () => setLog(id, !spec.symlog, true));
  logBtns[id] = btn;

  fig.insertBefore(btn, fig.firstChild);
}
if (!EMBEDDED) {
  try { for (const id of JSON.parse(localStorage.getItem(LOG_KEY) || '[]')) setLog(id, true, false); } catch (e) { /* none */ }
}
// Chart icons next to tickers: hovering (or focusing) one shows TradingView's mini chart for it in a small

// Inside the web app's sandboxed frame TradingView can't connect (the frame has no origin), so the host page
// draws the popup: this frame only tells it which symbol and where the icon is.
(() => {
  let pop = null, cur = null, showT = null, hideT = null;
  const dark = () => {
    const t = document.documentElement.dataset.theme;
    return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  };
  function show(a) {
    clearTimeout(hideT);
    if (cur === a) return;
    cur = a;
    if (EMBEDDED) {
      const r = a.getBoundingClientRect();
      parent.postMessage({ type: 'aa-tv', symbol: a.dataset.tv, theme: dark() ? 'dark' : 'light',
        rect: { left: r.left, top: r.top, right: r.right, bottom: r.bottom } }, '*');
      return;
    }

      pop.addEventListener('mouseenter', () => clearTimeout(hideT));
      pop.addEventListener('mouseleave', hideSoon);
      document.body.append(pop);
    }
    pop.replaceChildren(tvFrame(a.dataset.tv, dark()));
    pop.hidden = false;
    const r = a.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
    pop.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';

  }

  }
  function hideSoon() {

function tvFrame(symbol, dark) {

    isTransparent: false, autosize: true, largeChartUrl: '' };

}

// in-report links (e.g. a tile pointing at a table): scroll without touching the URL (the hash is the tab)
document.addEventListener('click', (e) => {

// sortable tables. In tables with collapsible groups, totals (and ungrouped rows) are sorted, and each

document.querySelectorAll('table.sortable').forEach(t => {
  t.querySelectorAll('th').forEach((th, i) => th.addEventListener('click', () => {
    const asc = !th.classList.contains('asc');

    th.classList.add(asc ? 'asc' : 'desc');
    const rows = Array.from(t.tBodies[0].rows);

// collapsible groups: ▸ on a total row shows the rows behind it; "Expand all" above the table
function setGroup(t, sum, open) {

  b.setAttribute('aria-expanded', String(open)); b.textContent = open ? '▾' : '▸';
  b.title = open ? 'Hide the rows behind this total' : 'Show the rows behind this total';

document.querySelectorAll('table.sortable').forEach(t => {
