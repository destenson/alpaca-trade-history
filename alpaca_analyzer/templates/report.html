<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading Performance Report</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10);
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
  --series-5: #e87ba4; --series-6: #008300; --series-7: #6250d6; --series-8: #e34948;
  --gain: #2a78d6; --loss: #e34948; --loss-fill: rgba(227,73,72,0.14);
  --gain-text: #1c5cab; --loss-text: #b8302f; --accent: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --series-5: #d55181; --series-6: #0ca30c; --series-7: #9085e9; --series-8: #e66767;
    --gain: #3987e5; --loss: #e66767; --loss-fill: rgba(230,103,103,0.18);
    --gain-text: #6da7ec; --loss-text: #ee8a8a; --accent: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
  --series-5: #d55181; --series-6: #0ca30c; --series-7: #9085e9; --series-8: #e66767;
  --gain: #3987e5; --loss: #e66767; --loss-fill: rgba(230,103,103,0.18);
  --gain-text: #6da7ec; --loss-text: #ee8a8a; --accent: #3987e5;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 20px 24px 0; max-width: 1360px; margin: 0 auto; display: flex; flex-wrap: wrap;
  gap: 8px 16px; align-items: baseline; justify-content: space-between; }
header h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
header .meta { color: var(--ink-2); font-size: 13px; }
nav { position: sticky; top: 0; z-index: 5; background: var(--page); border-bottom: 1px solid var(--grid); }
nav .in { max-width: 1360px; margin: 0 auto; padding: 0 16px; display: flex; gap: 2px; overflow-x: auto;
  scrollbar-width: none; }
nav a { padding: 12px 12px 10px; color: var(--ink-2); text-decoration: none; white-space: nowrap;
  border-bottom: 2px solid transparent; font-weight: 500; }
nav a:hover { color: var(--ink); }
nav a.on { color: var(--ink); border-bottom-color: var(--accent); }
nav button { margin-left: auto; background: none; border: 1px solid var(--ring); color: var(--ink-2);
  border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; align-self: center; }
main { max-width: 1360px; margin: 0 auto; padding: 16px 24px 48px; }
section.tab { display: none; }
section.tab.on { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
section.tab > h2 { grid-column: 1 / -1; font-size: 16px; margin: 4px 0 0; font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 14px 16px 10px;
  margin: 0; min-width: 0; }
.card.wide, .tiles, .tablewrap.wide { grid-column: 1 / -1; }
.card h3 { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
.card .sub { margin: 0 0 8px; color: var(--ink-2); font-size: 12.5px; }
.card .note { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 12px 14px; }
.tile .tl { color: var(--ink-2); font-size: 12px; }
.tile .tv { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.tile .td { color: var(--muted); font-size: 12px; }
.tablewrap { overflow: auto; max-height: 560px; border-top: 1px solid var(--grid); }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
th { position: sticky; top: 0; background: var(--surface); text-align: left; font-weight: 600; color: var(--ink-2);
  padding: 7px 10px; border-bottom: 1px solid var(--axis); cursor: pointer; white-space: nowrap; user-select: none; }
th.asc::after { content: " ▲"; font-size: 9px; } th.desc::after { content: " ▼"; font-size: 9px; }
td { padding: 6px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
tr:hover td { background: color-mix(in srgb, var(--accent) 6%, transparent); }
td.pos { color: var(--gain-text); } td.neg { color: var(--loss-text); }
.prose ul { margin: 4px 0; padding-left: 20px; } .prose li { margin: 6px 0; color: var(--ink-2); }
.prose b { color: var(--ink); }
.empty { color: var(--muted); }
.pick { display: flex; gap: 8px; align-items: center; margin: 8px 0 10px; color: var(--ink-2); font-size: 12.5px; }
.pick select { font: inherit; font-size: 13px; color: var(--ink); background: var(--page); border: 1px solid var(--axis);
  border-radius: 8px; padding: 6px 8px; max-width: 100%; flex: 1 1 auto; }
.interp-view .tablewrap { max-height: none; margin-bottom: 8px; }
.rp-table td, .rp-table th { white-space: nowrap; }
.rp-table tr.stale td { background: color-mix(in srgb, var(--series-1) 10%, transparent); }
.rp-table tr.stale td.rp-move { font-weight: 600; }
.rp-table input { font: inherit; font-size: 13px; width: 6.5em; padding: 3px 6px; color: var(--ink); background: var(--page);
  border: 1px solid var(--axis); border-radius: 6px; }
.rp-table input.rp-iv { width: 4.5em; }
.rp-table input:invalid { border-color: var(--loss); }
.rp-table button { font: inherit; font-size: 12px; color: var(--ink-2); background: transparent; border: 1px solid var(--axis);
  border-radius: 6px; padding: 3px 8px; cursor: pointer; }
.rp-table tr.edited td:first-child::after { content: " · edited"; color: var(--muted); font-weight: 400; font-size: 11px; }
.alert { grid-column: 1 / -1; border: 1px solid var(--loss); border-left-width: 4px; border-radius: 10px;
  background: color-mix(in srgb, var(--loss) 8%, var(--surface)); padding: 10px 16px; }
.alert ul { margin: 4px 0 0; padding-left: 18px; color: var(--ink-2); }
.plot { width: 100%; }
footer { max-width: 1360px; margin: 0 auto; padding: 0 24px 32px; color: var(--muted); font-size: 12px; }
@media (max-width: 860px) {
  header, main { padding-left: 16px; padding-right: 16px; }
  section.tab.on { grid-template-columns: minmax(0, 1fr); }
  .tile .tv { font-size: 19px; }
}
</style>
</head>
<body>
<header>
  <h1>Trading performance</h1>
  <div class="meta">{{SPAN}} · generated {{GENERATED}}</div>
</header>
<nav><div class="in">{{NAV}}<button id="theme" type="button" aria-label="Toggle color theme">Theme</button></div></nav>
<main>{{BODY}}</main>
<footer>Built by alpaca-analyzer from Alpaca account activities, portfolio history and market data. Not investment advice.</footer>
{{PLOTLY}}
<script>
const FIGS = {{FIGS}};
const drawn = new Set();
function tok(name) { return getComputedStyle(document.documentElement).getPropertyValue('--' + name).trim(); }
function resolve(v) {
  if (typeof v === 'string' && v.startsWith('var:')) return tok(v.slice(4));
  if (Array.isArray(v)) return v.map(resolve);
  if (v && typeof v === 'object') { const o = {}; for (const k in v) o[k] = resolve(v[k]); return o; }
  return v;
}
function axis(extra) {
  return Object.assign({ gridcolor: tok('grid'), linecolor: tok('axis'), zerolinecolor: tok('axis'),
    tickfont: { color: tok('muted'), size: 11 }, title: { font: { color: tok('ink-2'), size: 12 } },
    automargin: true, showline: false }, extra || {});
}
function layoutFor(spec) {
  const l = resolve(spec.layout);
  const base = { paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
    font: { family: 'system-ui, -apple-system, Segoe UI, sans-serif', color: tok('ink'), size: 12 },
    legend: { orientation: 'h', y: 1.02, yanchor: 'bottom', x: 0, font: { color: tok('ink-2'), size: 12 } },
    hoverlabel: { bgcolor: tok('surface'), bordercolor: tok('axis'), font: { color: tok('ink'), size: 12 } } };
  const out = Object.assign({}, base, l);
  out.xaxis = axis(Object.assign({ hoverformat: '' }, l.xaxis || {}));
  out.yaxis = axis(l.yaxis);
  delete out.xaxis.hoverformat;
  return out;
}
function draw(id) {
  const el = document.getElementById(id); const spec = FIGS[id];
  if (!el || !spec || typeof Plotly === 'undefined') return;
  Plotly.react(el, resolve(spec.data), layoutFor(spec), { displaylogo: false, responsive: true,
    modeBarButtonsToRemove: ['lasso2d', 'select2d', 'autoScale2d'] });
  drawn.add(id);
}
function drawVisible() {
  document.querySelectorAll('section.tab.on .plot').forEach(el => { if (el.offsetParent !== null) draw(el.id); });
}
function show(id) {
  const secs = document.querySelectorAll('section.tab');
  if (!document.getElementById(id)) id = secs[0] && secs[0].id;
  secs.forEach(s => s.classList.toggle('on', s.id === id));
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.dataset.tab === id));
  try { localStorage.setItem('aa-tab', id); } catch (e) {}
  if (window.parent !== window) parent.postMessage({ type: 'aa-tab', tab: id }, '*');
  requestAnimationFrame(drawVisible);
}
document.querySelectorAll('nav a').forEach(a => a.addEventListener('click', e => {
  e.preventDefault(); try { history.replaceState(null, '', '#' + a.dataset.tab); } catch (err) {} show(a.dataset.tab);
}));
// Theme. When the report is embedded (e.g. the web app's sandboxed frame), the host page owns the
// theme: the toggle asks the host to switch, and the host pushes its theme in. Only a theme name is
// ever exchanged.
const EMBEDDED = window.parent !== window;
function setTheme(t, notify) {
  const root = document.documentElement;
  if (t === 'light' || t === 'dark') root.dataset.theme = t; else delete root.dataset.theme;
  try { localStorage.setItem('aa-theme', root.dataset.theme || ''); } catch (e) {}
  drawn.clear(); drawVisible();
  if (notify && EMBEDDED) parent.postMessage({ type: 'aa-theme', theme: root.dataset.theme }, '*');
}
document.getElementById('theme').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  setTheme(dark ? 'light' : 'dark', true);
});
window.addEventListener('message', (e) => {
  if (!EMBEDDED || e.source !== window.parent || !e.data) return;
  if (e.data.type === 'aa-set-theme') setTheme(e.data.theme, false);
  if (e.data.type === 'aa-set-tab' && typeof e.data.tab === 'string') show(e.data.tab);
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { drawn.clear(); drawVisible(); });
// alternative readings of open positions: one view visible at a time
document.querySelectorAll('select.interp').forEach(sel => sel.addEventListener('change', () => {
  const box = document.getElementById(sel.dataset.box);
  box.querySelectorAll(':scope > .interp-view').forEach(v => { v.hidden = v.id !== sel.value; });
  box.querySelectorAll('#' + sel.value + ' .plot').forEach(el => draw(el.id));
}));
// Re-pricing of open orders (Orders tab): Black-Scholes in the page so edited prices / IV changes
// update the estimates, table cells and charts for that underlying. Mirrors alpaca_analyzer.reprice.
(function () {
  const holder = document.getElementById('rp-data');
  if (!holder) return;
  const RP = JSON.parse(holder.textContent);
  const R = RP.r;
  function erf(x) {  // Abramowitz-Stegun 7.1.26, |error| < 1.5e-7
    const s = Math.sign(x); x = Math.abs(x);
    const t = 1 / (1 + 0.3275911 * x);
    return s * (1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x));
  }
  const N = (x) => 0.5 * (1 + erf(x / Math.SQRT2));
  function bs(S, K, T, iv, call) {
    if (T <= 0 || iv <= 0) return call ? Math.max(S - K, 0) : Math.max(K - S, 0);
    const v = iv * Math.sqrt(T), d1 = (Math.log(S / K) + (R + 0.5 * iv * iv) * T) / v, d2 = d1 - v, df = Math.exp(-R * T);
    return call ? S * N(d1) - K * df * N(d2) : K * df * N(-d2) - S * N(-d1);
  }
  // P&L of a leg set at underlying S (legs: [strike, is_call, qty x100, T, iv])
  function pnl(m, S, shift) {
    let y = -m.cost + m.shares * S;
    for (const [K, c, q, T, iv] of m.legs) y += q * bs(S, K, T, Math.max(iv * (1 + shift), 1e-3), c === 1);
    return y;
  }
  const r2 = (v) => Math.round(v * 100) / 100;
  const fmt = (v) => '$' + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const px = (v) => fmt(v) + (v > 0 ? ' debit' : v < 0 ? ' credit' : ' even');
  const signed = (v) => (v < 0 ? '−' : v > 0 ? '+' : '') + fmt(v);
  function fillText(est, net) {
    const e = est - net;
    return e <= 0.005 ? 'at or through your limit: likely to fill near the open'
      : `your limit is ${fmt(e)} better than the estimate: fills only if prices move your way`;
  }
  const table = document.getElementById('t_orders');
  const col = (name) => table ? [...table.tHead.rows[0].cells].findIndex((c) => c.textContent === name) : -1;
  const cEst = col(RP.est_col), cEdge = col('Edge vs est.'), cSpot = col('Spot');
  function setCell(k, ci, text, v, pn) {
    if (!table || ci < 0) return;
    const row = [...table.tBodies[0].rows].find((r) => r.cells[0].dataset.v === String(k));
    if (!row) return;
    const td = row.cells[ci];
    td.textContent = text; td.dataset.v = String(v);
    if (pn) { td.classList.toggle('pos', v > 0); td.classList.toggle('neg', v < 0); }
  }
  function update(tr) {
    const und = tr.dataset.und;
    const sIn = tr.querySelector('.rp-spot'), vIn = tr.querySelector('.rp-iv');
    const S = parseFloat(sIn.value), shift = (parseFloat(vIn.value) || 0) / 100;
    if (!(S > 0) || !(shift > -0.95)) return;
    const ref = parseFloat(sIn.dataset.ref);
    const mv = tr.querySelector('.rp-move');
    const move = S / ref - 1;
    mv.textContent = (move < 0 ? '−' : move > 0 ? '+' : '') + Math.abs(move * 100).toFixed(1) + '%';
    tr.classList.toggle('stale', Math.abs(move) >= 0.02);
    tr.classList.toggle('edited', sIn.value !== sIn.dataset.default || (parseFloat(vIn.value) || 0) !== 0);
    for (const v of RP.views) {
      if (v.und !== und) continue;
      const spec = FIGS[v.fid];
      spec.data[v.t_open].y = v.x.map((x) => r2(pnl(v.order, x, shift)));
      if (v.t_comb !== null && v.pos) spec.data[v.t_comb].y = v.x.map((x) => r2(pnl(v.order, x, shift) + pnl(v.pos, x, shift)));
      const at = pnl(v.order, S, shift);
      if (v.t_mark !== null) { spec.data[v.t_mark].x = [S]; spec.data[v.t_mark].y = [r2(at)]; }
      spec.layout.shapes[0].x0 = spec.layout.shapes[0].x1 = S;
      spec.layout.annotations[0].x = S;
      spec.layout.annotations[0].text = (Math.abs(move) >= 0.02 ? 'estimate at $' : 'spot $') + S.toFixed(2);
      const estTotal = at + v.order.cost;            // model value of the legs, $ (+ debit)
      const el = document.getElementById(v.est);
      if (el) {
        const head = `Estimated value at ${RP.when}: `;
        el.innerHTML = '';
        el.append(head);
        const b = document.createElement('b');
        if (v.um) {
          b.textContent = px(estTotal / v.um);
          el.append(b, ` vs your limit ${px(v.net / v.um)} · ${fillText(estTotal / v.um, v.net / v.um)}`);
        } else {
          b.textContent = px(estTotal);
          el.append(b, ` vs ${px(v.net)} at your limits`);
        }
      }
      for (const k of v.rows) {
        setCell(k, cEst, px(estTotal / v.um), estTotal / v.um, false);
        const edge = estTotal - v.net;
        setCell(k, cEdge, signed(edge), edge, true);
        setCell(k, cSpot, fmt(S), S, false);
      }
      const plot = document.getElementById(v.fid);
      if (plot && plot.offsetParent !== null) draw(v.fid);
    }
  }
  document.querySelectorAll('.rp-table tbody tr').forEach((tr) => {
    tr.querySelectorAll('input').forEach((i) => i.addEventListener('input', () => update(tr)));
    tr.querySelector('.rp-reset').addEventListener('click', () => {
      const sIn = tr.querySelector('.rp-spot');
      sIn.value = sIn.dataset.default; tr.querySelector('.rp-iv').value = '0'; update(tr);
    });
  });
})();
// sortable tables
document.querySelectorAll('table.sortable').forEach(t => {
  t.querySelectorAll('th').forEach((th, i) => th.addEventListener('click', () => {
    const asc = !th.classList.contains('asc');
    t.querySelectorAll('th').forEach(h => h.classList.remove('asc', 'desc'));
    th.classList.add(asc ? 'asc' : 'desc');
    const rows = Array.from(t.tBodies[0].rows);
    const val = r => { const v = r.cells[i].dataset.v; const n = parseFloat(v); return isNaN(n) || !/^-?[\d.e+-]+$/.test(v) ? v : n; };
    rows.sort((a, b) => { const x = val(a), y = val(b);
      const c = (typeof x === 'number' && typeof y === 'number') ? x - y : String(x).localeCompare(String(y));
      return asc ? c : -c; });
    rows.forEach(r => t.tBodies[0].appendChild(r));
  }));
});
try { const th = localStorage.getItem('aa-theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
if (EMBEDDED) parent.postMessage({ type: 'aa-ready' }, '*');
let start = location.hash.slice(1);
try { start = start || localStorage.getItem('aa-tab'); } catch (e) {}
show(start || 'overview');
</script>
</body>
</html>
