name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rust toolchain (WebAssembly target)
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Test the analysis engine (Rust)
        run: cargo test --release --manifest-path engine/Cargo.toml
      - name: Test the Python reference / CLI
        run: |
          pip install -e '.[test]'
          pytest -q
      - name: Configure Pages (source must be "GitHub Actions")
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build site
        run: |
          python scripts/build_site.py site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
